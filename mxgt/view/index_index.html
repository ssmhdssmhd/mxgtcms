<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沫兮官替官解系统</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f7f8fa; color: #333; }
    .wrap { max-width: 640px; margin: 80px auto; background: #fff; border-radius: 8px; padding: 40px; box-shadow: 0 2px 12px rgba(0,0,0,.06); text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .ver { color: #999; font-size: 14px; margin-bottom: 20px; }
    .desc { color: #666; font-size: 14px; line-height: 1.9; text-align: left; }
</style>
</head>
<body>
<div class="wrap">
    <h1>沫兮官替官解系统</h1>
    <div class="ver">
        v{$versionInfo['version']|default='0.0.1'} {if condition="isset($versionInfo['release_time'])"} · {$versionInfo['release_time']}{/if}
    </div>
    <p class="desc">
        本插件需在新版苹果CMS后台使用：<br>
        · mxgt 插件位于 addons 目录，后台可配置、启用、停用、卸载；<br>
        · mxthxt 组件位于苹果CMS根目录，提供云端在线更新能力。<br>
        当前页面为插件前台入口，管理功能请前往苹果CMS后台操作。
    </p>
</div>

</html>
